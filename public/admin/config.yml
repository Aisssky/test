# ============================================================================
# Decap CMS 配置
#
# 两条链路并存：
#
#   本地  → local_backend 直读本机文件（写 crypto.randomUUID() 之前先跑这条）
#           终端 A: npm run dev   →  http://localhost:4321/test/
#           终端 B: npm run cms   →  本地代理，默认 http://localhost:8081
#           浏览器打开 http://localhost:4321/test/admin/
#           CMS 直接读写本机 src/content/blog/*.md 与 public/images/uploads/
#
#   线上  → turbo-github → Decap Turbo → GitHub Aisssky/test
#           线上 hostname 不是 localhost，local_backend 自动不生效，无需切换配置
#
# 字段必须与 src/content.config.ts 的 schema 保持一致，
# 否则 Astro 构建时会因为 frontmatter 校验失败而报错。
# ============================================================================

backend:
  # turbo-github 由 Decap Turbo 托管认证并代理 GitHub API，
  # 不需要自己部署 OAuth proxy，也不需要 GitHub OAuth App。
  name: turbo-github

  # Turbo 站点详情页 Overview 标签页里的 UUID（站点：Aisssky Blog）
  turbo_site_id: 7ebd2b8d-eafd-41ec-bfee-789965540898

  # 仓库以 Turbo dashboard 里该站点的配置为准；这里保持与之一致即可，
  # 若两边不一致会报 "requested repo does not match"。
  repo: Aisssky/test

  # branch 若显式填写则以这里为准（默认落到 dashboard 的值）
  branch: main

# 本地开发免登录； hostname 不是 localhost 时自动跳过，不影响线上
local_backend: true

# 站点地址（用于「查看已发布页面」的预览链接）
site_url: https://aisssky.github.io/test
display_url: https://aisssky.github.io/test/

# 中文界面
locale: zh_Hans

# 图片统一存到 public/images/uploads/，正文里写 /images/uploads/xxx.jpg
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: 文章
    label_singular: 文章
    description: 文章源文件是普通 Markdown，提交后由 GitHub Actions 自动构建发布。
    folder: src/content/blog
    create: true
    delete: true
    # 新建文件的命名规则，与已有文章保持一致
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: 'blog/{{slug}}/'
    summary: '{{title}} · {{pubDate}}'
    sortable_fields: ['pubDate', 'updatedDate', 'title']
    view_filters:
      - label: 只看草稿
        field: draft
        pattern: true
      - label: 只看已发布
        field: draft
        pattern: false
    fields:
      - label: 标题
        name: title
        widget: string
        hint: 会显示在文章页顶部和列表里

      - label: 简介
        name: description
        widget: text
        required: false
        hint: 一两句话说明，会进 meta description 和列表摘要

      - label: 发布日期
        name: pubDate
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true

      - label: 更新日期
        name: updatedDate
        widget: datetime
        required: false
        date_format: 'YYYY-MM-DD'
        time_format: false
        picker_utc: true
        hint: 留空则页面只显示发布日期

      - label: 副标题
        name: subtitle
        widget: string
        required: false
        hint: 头图下方的一行小字，适合写日期区间或期数

      - label: 分类
        name: category
        widget: string
        required: false
        hint: 单值，例如「技术」「图形学」「项目日志」

      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        hint: 回车逐个添加

      - label: 封面图
        name: cover
        widget: image
        required: false
        allow_multiple: false
        hint: 同时作为文章顶部的固定头图；留空则用纯色

      - label: 版权署名
        name: copyright
        widget: string
        required: false
        hint: 留空则用站点默认的「© Aisssky」

      - label: 草稿
        name: draft
        widget: boolean
        default: false
        hint: 打开后只在本地 dev 可见，不会进入正式构建和 RSS

      - label: 显示侧边索引
        name: toc
        widget: boolean
        default: true

      - label: 正文
        name: body
        widget: markdown

  # ------------------------------------------------------------------
  # 随记（Notes）：游戏开发之外的记录。
  # 与 src/content.config.ts 里的 notes 集合保持一致；无单篇详情页，
  # 正文直接渲染在 /notes/ 列表页。
  # ------------------------------------------------------------------
  - name: notes
    label: 随记
    label_singular: 随记
    description: 游戏开发之外的随手记录，正文会直接显示在 /notes/ 列表页。
    folder: src/content/notes
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: ['date', 'title']
    fields:
      - label: 日期
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        hint: 这条随记发生 / 写下的日期

      - label: 标题
        name: title
        widget: string
        required: false
        hint: 可留空，留空就只显示日期和正文

      - label: 一句话说明
        name: description
        widget: text
        required: false
        hint: 会显示在首页 Notes 列表里；留空则首页只显示标题

      - label: 标签
        name: tags
        widget: list
        required: false
        default: []

      - label: 草稿
        name: draft
        widget: boolean
        default: false

      - label: 正文
        name: body
        widget: markdown

  # ------------------------------------------------------------------
  # 倒霉熊日记（badluck）：一个文件 = 一天，文件名 = 日期。
  # 与 src/content.config.ts 的 badluck 集合保持一致（date 必填，
  # cup / cups / draft 可选）。无单篇详情页：About 首页显示最近 5 条，
  # 全量在 /diary/。
  #
  # ⚠️ 同一天又倒霉了：不要新建条目（文件名会撞），
  #    打开当天那条，把新杯号加到「同一天多杯」列表、正文往下加一行。
  # ------------------------------------------------------------------
  - name: badluck
    label: 倒霉熊日记
    label_singular: 日记
    description: 一杯一杯敬自己。正文逐字原样，不要润色。
    folder: src/content/badluck
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}'
    summary: '{{date}} · 第{{cup}}杯'
    sortable_fields: ['date']
    fields:
      - label: 日期
        name: date
        widget: datetime
        format: 'YYYY-MM-DD'
        hint: 发生 / 写下这条的日期，文件名就是它

      - label: 第几杯
        name: cup
        widget: number
        value_type: int
        min: 1
        required: false
        hint: 这一天只写了一杯就填这里；多杯请往下填「同一天多杯」，两个不要同时填

      - label: 同一天多杯
        name: cups
        widget: list
        required: false
        field:
          label: 杯号
          name: cup
          widget: number
          value_type: int
          min: 1
        hint: 按正文顺序填，例如 31、32。留空表示这一天只有一杯

      - label: 草稿
        name: draft
        widget: boolean
        default: false
        hint: 只想起了「第几杯敬自己」、正文还没写出来时勾上，就不会出现在页面上

      - label: 正文
        name: body
        widget: markdown
        hint: 逐字原样写，不要润色、不要补标点、不要删 emoji。要不要以「第X杯敬自己，」开头都行，页面会自动处理
