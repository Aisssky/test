  <text x="720" y="404" font-size="10" fill="#6B6A64">节点内含 key + value ｜ 桶里挂的是 <tspan font-family="'Cascadia Mono',Consolas,monospace">pair&lt;const K, V&gt;</tspan> 节点</text>
  <text x="720" y="424" font-size="9.5" fill="#8A8880">自定义类型当 key 需提供 <tspan font-family="'Cascadia Mono',Consolas,monospace">std::hash</tspan> 与 <tspan font-family="'Cascadia Mono',Consolas,monospace">operator==</tspan></text>

