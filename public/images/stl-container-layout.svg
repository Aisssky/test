  <g font-family="'Cascadia Mono',Consolas,monospace" font-size="11.5" font-weight="600" fill="#2A2A26">
    <text x="40" y="74">array</text>
    <text x="40" y="160">vector</text>
    <text x="40" y="242">deque</text>
    <text x="40" y="336">list</text>
    <text x="40" y="420">forward_list</text>
    <text x="372" y="74">set / multiset</text>
    <text x="372" y="262">map / multimap</text>
    <text x="720" y="74">unordered_set</text>
    <text x="720" y="262">unordered_map</text>
  </g>
  <g font-size="9.5" fill="#8A8880" text-anchor="end">
    <text x="340" y="74">定长 · 连续</text>
    <text x="340" y="160">动态 · 连续</text>
    <text x="340" y="242">分段连续 + 中控</text>
    <text x="340" y="336">双向链表 · 节点分散</text>
    <text x="340" y="420">单向链表</text>
    <text x="688" y="74">节点只存 key</text>
    <text x="688" y="262">节点存 key + value</text>
    <text x="960" y="74">桶数组 + 单链</text>
    <text x="960" y="262">桶数组 + 单链</text>
  </g>

