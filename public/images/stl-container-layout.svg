  </g>
  <text x="40" y="132" font-size="10" fill="#6B6A64">随机访问 O(1) ｜ 不能增删 ｜ 大小编译期固定，<tspan font-family="'Cascadia Mono',Consolas,monospace">++</tspan> 就是 +1</text>

  <g fill="#FFFFFF" stroke="#2A2A28" stroke-width="1.2">
    <rect x="40" y="170" width="36" height="30"/><rect x="76" y="170" width="36" height="30"/><rect x="112" y="170" width="36" height="30"/><rect x="148" y="170" width="36" height="30"/>
    <rect x="184" y="170" width="36" height="30"/><rect x="220" y="170" width="36" height="30"/><rect x="256" y="170" width="36" height="30"/>
