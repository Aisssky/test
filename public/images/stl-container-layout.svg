  </g>
  <text x="372" y="404" font-size="10" fill="#6B6A64">按 key 有序 ｜ value 不参与比较 ｜ 节点宽 = 两个 value_type</text>
  <text x="372" y="434" font-size="10" fill="#8A8880">红黑树 = 自平衡 BST，树高 ≤ 2·log₂(n+1) → 最坏也是 O(log n)</text>

