  <rect x="0.5" y="0.5" width="999" height="523" rx="14" fill="#FBFAF7" stroke="#E3E0D8"/>

  <text x="40" y="36" font-size="12.5" font-weight="600" fill="#2A2A26" letter-spacing="0.3">序列式 Sequence Containers</text>
  <line x1="40" y1="46" x2="340" y2="46" stroke="#378ADD" stroke-width="2"/>
  <text x="372" y="36" font-size="12.5" font-weight="600" fill="#2A2A26" letter-spacing="0.3">有序关联式 Ordered · 红黑树</text>
  <line x1="372" y1="46" x2="688" y2="46" stroke="#1D9E75" stroke-width="2"/>
  <text x="720" y="36" font-size="12.5" font-weight="600" fill="#2A2A26" letter-spacing="0.3">无序关联式 Unordered · 哈希桶</text>
  <line x1="720" y1="46" x2="960" y2="46" stroke="#BA7517" stroke-width="2"/>

  <line x1="356" y1="62" x2="356" y2="486" stroke="#DCD9D0" stroke-width="1" stroke-dasharray="4 5"/>
